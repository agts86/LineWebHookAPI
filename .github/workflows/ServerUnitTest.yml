name: ServerUnitTest

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ServerUnitTest.yml'
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ServerUnitTest.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public&sslmode=disable

    steps:
    - uses: actions/checkout@v5

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.26.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Sync DB schema
      # prisma migrateは使わない（EF Coreがスキーマの記録上の所有者のため）。
      # schema.prismaの内容をそのままCI用の使い捨てDBへ反映するだけのdb pushを使う。
      run: pnpm --filter @api/tables exec prisma db push --skip-generate

    - name: Build
      run: pnpm turbo run build --filter="@api/*"

    - name: Lint
      run: pnpm turbo run lint --filter="@api/*"

    - name: Test with coverage
      # GitHub ActionsはCI=trueを自動設定するため、素のままだとvitestが
      # ANSIカラーコードを強制出力し、tee先のログ→job summaryが文字化けする。
      # NO_COLOR=1でそれを抑止する。
      env:
        NO_COLOR: '1'
      # デフォルトのbash -e {0}にはpipefailが付かず、teeを挟むとpnpmの失敗が
      # ステップの失敗として伝播しない（teeの終了コードで上書きされる）ため明示する。
      run: |
        set -o pipefail
        pnpm turbo run test:coverage --filter="@api/*" | tee /tmp/test-coverage.log

    - name: Report Coverage - shared
      uses: davelosert/vitest-coverage-report-action@v2
      if: always()
      with:
        name: 'shared'
        comment-on: 'none'
        json-summary-path: 'server/src/shared/coverage/coverage-summary.json'

    - name: Report Coverage - tables
      uses: davelosert/vitest-coverage-report-action@v2
      if: always()
      with:
        name: 'tables'
        comment-on: 'none'
        json-summary-path: 'server/src/tables/coverage/coverage-summary.json'

    - name: Report Coverage - features/auth
      uses: davelosert/vitest-coverage-report-action@v2
      if: always()
      with:
        name: 'features/auth'
        comment-on: 'none'
        json-summary-path: 'server/src/features/auth/coverage/coverage-summary.json'

    - name: Report Coverage - features/managed
      uses: davelosert/vitest-coverage-report-action@v2
      if: always()
      with:
        name: 'features/managed'
        comment-on: 'none'
        json-summary-path: 'server/src/features/managed/coverage/coverage-summary.json'

    - name: Report Coverage - features/webhook
      uses: davelosert/vitest-coverage-report-action@v2
      if: always()
      with:
        name: 'features/webhook'
        comment-on: 'none'
        json-summary-path: 'server/src/features/webhook/coverage/coverage-summary.json'

    - name: Report Coverage - infrastructure
      uses: davelosert/vitest-coverage-report-action@v2
      if: always()
      with:
        name: 'infrastructure'
        comment-on: 'none'
        json-summary-path: 'server/src/infrastructure/coverage/coverage-summary.json'

    - name: Report Coverage - host
      uses: davelosert/vitest-coverage-report-action@v2
      if: always()
      with:
        name: 'host'
        comment-on: 'none'
        json-summary-path: 'server/src/host/coverage/coverage-summary.json'
