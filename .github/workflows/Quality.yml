name: Quality

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  format:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Setup Biome
      uses: biomejs/setup-biome@v2
      with:
        version: 2.5.4

    - name: Format check
      run: biome format .

  web:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.26.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm turbo run lint:check --filter=line-webhook-ui

    - name: Typecheck
      run: pnpm turbo run typecheck --filter=line-webhook-ui

    - name: Test
      run: pnpm turbo run test --filter=line-webhook-ui
