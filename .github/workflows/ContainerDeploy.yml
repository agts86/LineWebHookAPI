# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - line-webhook-api

on:
  push:
    branches:
      - develop
    paths:
      - 'server/**'
      - 'web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - '.github/workflows/ContainerDeploy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
      packages: write #This is required for pushing to a container registry

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CC27AF4F4BCC46F88F73421CB9088FB8 }}/agts86/line-webhook-api:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CD85A47FBB0C4E3D8619FD9D333E40DF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FA85117942494F1FB3BE893C12938196 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D055A9AAA1A74E89844C63725B56B93C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'line-webhook-api'
          slot-name: 'Production'
          images: 'ghcr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CC27AF4F4BCC46F88F73421CB9088FB8 }}/agts86/line-webhook-api:${{ github.sha }}'
  wake-up:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Ping health endpoint with retries
        env:
          URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "KEEPALIVE_URL secret is not set"; exit 1
          fi
          echo "Pinging: $URL"
          for i in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "204" ]; then
              echo "OK (HTTP $CODE)"; exit 0
            fi
            echo "Attempt $i failed (HTTP $CODE). Retrying in 10s..."
            sleep 10
          done
          echo "All retries failed"; exit 1
          
