services:
  install:
    container_name: install
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: pnpm install --store-dir /tmp/pnpm-store
    volumes:
      - .:/app

  web:
    container_name: web
    build:
      context: ./web
      dockerfile: dockerfile.dev
    working_dir: /app/web
    command: pnpm exec next dev -p 3000 -H 0.0.0.0
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
      - CI=true
      - API_BASE_URL=http://localhost:3001
    network_mode: "host"
    volumes:
      - .:/app
    depends_on:
      install:
        condition: service_completed_successfully
      server:
        condition: service_started

  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    working_dir: /app/server/src/host
    command: >
      sh -c "cd /app &&
      pnpm --filter @api/tables exec prisma generate &&
      pnpm --filter @api/host exec node --watch --conditions=development --import @swc-node/register/esm-register src/main.ts"
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
    env_file:
      - ./server/src/host/.env
    network_mode: "host"
    volumes:
      - .:/app
    depends_on:
      install:
        condition: service_completed_successfully
      postgres:
        condition: service_started

  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:
