services:
  web:
    container_name: web
    build:
      context: ./web
      dockerfile: dockerfile.dev
    working_dir: /app
    command: >
      sh -c "pnpm install --store-dir /tmp/pnpm-store &&
      pnpm exec next dev -p 3000 -H 0.0.0.0"
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
      - CI=true
      - API_BASE_URL=http://localhost:3001
    network_mode: "host"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - server

  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    working_dir: /app/src/host
    command: >
      sh -c "cd /app &&
      pnpm install --store-dir /tmp/pnpm-store &&
      pnpm --filter @api/tables exec prisma generate &&
      pnpm --filter @api/host exec node --watch --conditions=development --import @swc-node/register/esm-register src/main.ts"
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
    env_file:
      - ./server/src/host/.env
    network_mode: "host"
    volumes:
      - ./server:/app
    depends_on:
      - postgres

  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:
  web_node_modules:
